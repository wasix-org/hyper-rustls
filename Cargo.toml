[package]
name = "hyper-rustls"
version = "0.27.7"
edition = "2021"
rust-version = "1.71"
license = "Apache-2.0 OR ISC OR MIT"
readme = "README.md"
description = "Rustls+hyper integration for pure rust HTTPS"
homepage = "https://github.com/rustls/hyper-rustls"
repository = "https://github.com/rustls/hyper-rustls"
documentation = "https://docs.rs/hyper-rustls/"

[features]
default = ["native-tokio", "http1", "tls12", "logging", "ring"]
aws-lc-rs = ["rustls/aws_lc_rs"]
fips = ["aws-lc-rs", "rustls/fips"]
http1 = ["hyper-util/http1"]
http2 = ["hyper-util/http2"]
logging = ["log", "tokio-rustls/logging", "rustls/logging"]
native-tokio = ["rustls-native-certs"]
ring = ["rustls/ring"]
tls12 = ["tokio-rustls/tls12", "rustls/tls12"]
webpki-tokio = ["webpki-roots"]

[dependencies]
http = "1"
hyper = { version = "1", git = "https://github.com/wasix-org/hyper.git", branch = "wasix-1.6.0", default-features = false }
hyper-util = { version = "0.1", git = "https://github.com/wasix-org/hyper-util", branch = "wasix-0.1.16", default-features = false, features = ["client-legacy", "tokio"] }
log = { version = "0.4.4", optional = true }
pki-types = { package = "rustls-pki-types", version = "1" }
rustls-native-certs = { version = "0.8", git = "https://github.com/wasix-org/rustls-native-certs.git", branch = "wasix-0.8.1", optional = true }
rustls-platform-verifier = { version = "0.6", optional = true }
rustls = { git = "https://github.com/wasix-org/rustls.git", branch = "wasix-0.23.31", default-features = false, features = ["tls12"]}
tokio = { version = "=1.47.0", git = "https://github.com/wasix-org/tokio.git", branch = "wasix-1.47.0" }
tokio-rustls = { git = "https://github.com/wasix-org/tokio-rustls.git", branch = "wasix-0.26.2", default-features = false }
tower-service = "0.3"
webpki-roots = { git = "https://github.com/wasix-org/webpki-roots.git", branch = "wasix-1.0.2", optional = true }

[dev-dependencies]
cfg-if = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", git = "https://github.com/wasix-org/hyper-util", branch = "wasix-0.1.16", default-features = false, features = ["server-auto"] }
rustls = { git = "https://github.com/wasix-org/rustls.git", branch = "wasix-0.23.31", default-features = false, features = ["tls12"] }
rustls-pemfile = "2"
tokio = { version = "=1.47.0", git = "https://github.com/wasix-org/tokio.git", branch = "wasix-1.47.0", features = [
    "io-std",
    "fs",
    "macros",
    "net",
    "rt-multi-thread",
] }

[[example]]
name = "client"
path = "examples/client.rs"
required-features = ["native-tokio", "http1"]

[[example]]
name = "server"
path = "examples/server.rs"
required-features = ["aws-lc-rs"]

[package.metadata.docs.rs]
no-default-features = true
features = [
    "http1",
    "http2",
    "logging",
    "native-tokio",
    "ring",
    "rustls-platform-verifier",
    "tls12",
    "webpki-tokio",
]
rustdoc-args = ["--cfg", "docsrs"]

[patch.crates-io]
tokio = { git = "https://github.com/wasix-org/tokio.git", branch = "wasix-1.47.0" }
hyper = { git = "https://github.com/wasix-org/hyper.git", branch = "wasix-1.6.0" }
socket2 = { git = "https://github.com/wasix-org/socket2.git", branch = "wasix-0.6.0" }
